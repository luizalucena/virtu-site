<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página não encontrada — Virtù</title>
  <meta name="description" content="Ops! A página que procura não existe. Explore a coleção Virtù." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy:  #2B3F54;
      --cream: #F5F2EE;
      --gold:  #C4934A;
      --sand:  #E8E0D5;
      --text:  #4A4440;
      --muted: #9E9690;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Jost', system-ui, sans-serif;
      background: var(--cream);
      color: var(--navy);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Navbar mínima ─────────────────────────────────── */
    .navbar {
      background: var(--navy);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .navbar__logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .navbar__logo-icon {
      width: 26px;
      height: 26px;
      opacity: 0.92;
    }

    .navbar__logo-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.35em;
      color: var(--cream);
    }

    /* ── Conteúdo principal ────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 5rem;
      text-align: center;
    }

    /* SVG ilustração: concha com "404" */
    .ilustracao {
      width: 160px;
      height: 160px;
      margin-bottom: 2.5rem;
      opacity: 0.85;
    }

    .tag-404 {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 4px 14px;
      border-radius: 2px;
      margin-bottom: 1.5rem;
    }

    .titulo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--navy);
      margin-bottom: 1rem;
    }

    .titulo em {
      font-style: italic;
      color: var(--gold);
    }

    .descricao {
      font-size: 0.9rem;
      font-weight: 300;
      line-height: 1.75;
      color: var(--text);
      max-width: 380px;
      margin: 0 auto 2.5rem;
    }

    /* ── Botões ─────────────────────────────────────────── */
    .botoes {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 32px;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }

    .btn--primario {
      background: var(--navy);
      color: var(--cream);
      border: 1px solid var(--navy);
    }

    .btn--primario:hover {
      background: #1E2E3E;
      transform: translateY(-1px);
    }

    .btn--secundario {
      background: transparent;
      color: var(--navy);
      border: 1px solid var(--navy);
    }

    .btn--secundario:hover {
      background: var(--sand);
    }

    /* ── Linha divisória ────────────────────────────────── */
    .divider {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 3rem auto 0;
      opacity: 0.5;
    }

    /* ── Footer mínimo ──────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Mobile ─────────────────────────────────────────── */
    @media (max-width: 480px) {
      .botoes {
        flex-direction: column;
        align-items: stretch;
      }
      .btn {
        justify-content: center;
        padding: 14px 24px;
      }
      .ilustracao {
        width: 120px;
        height: 120px;
      }
    }
  </style>
  <!-- ▸ Segurança: Referrer-Policy e CSP via meta tag (GitHub Pages) -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://oxivtnuxnghpddwawfdr.supabase.co https://lh3.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://oxivtnuxnghpddwawfdr.supabase.co wss://oxivtnuxnghpddwawfdr.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <link rel="stylesheet" href="css/virtu-refinements.css" />
  <script src="js/error-logger.js" defer></script>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a class="navbar__logo" href="/" aria-label="Virtù — Início">
      <svg class="navbar__logo-icon" viewBox="0 0 100 80" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M50 72C50 72 8 50 8 24C8 14.06 16.06 6 26 6C33.6 6 40.18 10.6 43.2 17.2C44.22 19.44 47.12 20 50 20C52.88 20 55.78 19.44 56.8 17.2C59.82 10.6 66.4 6 74 6C83.94 6 92 14.06 92 24C92 50 50 72 50 72Z" fill="#C4934A" opacity="0.9"/>
      </svg>
      <span class="navbar__logo-text">VIRTÙ</span>
    </a>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main">

    <!-- Ilustração SVG inline: número 404 estilizado -->
    <svg class="ilustracao" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Círculo de fundo suave -->
      <circle cx="80" cy="80" r="72" fill="#E8E0D5" opacity="0.6"/>
      <!-- Concha decorativa (centro) -->
      <path d="M80 108C80 108 52 93 52 74C52 65.16 59.16 58 68 58C73.26 58 77.94 60.62 80.72 64.72C81.42 65.74 82.58 66 80 66C77.42 66 78.58 65.74 79.28 64.72C82.06 60.62 86.74 58 92 58C100.84 58 108 65.16 108 74C108 93 80 108 80 108Z" fill="#2B3F54" opacity="0.15"/>
      <!-- Número 4 esquerda -->
      <text x="18" y="98" font-family="Georgia, serif" font-size="56" font-weight="400" fill="#2B3F54" opacity="0.2">4</text>
      <!-- Número 0 -->
      <text x="55" y="98" font-family="Georgia, serif" font-size="56" font-weight="400" fill="#C4934A" opacity="0.35">0</text>
      <!-- Número 4 direita -->
      <text x="96" y="98" font-family="Georgia, serif" font-size="56" font-weight="400" fill="#2B3F54" opacity="0.2">4</text>
    </svg>

    <span class="tag-404">Erro 404</span>

    <h1 class="titulo">
      Esta página<br><em>não existe</em>
    </h1>

    <p class="descricao">
      O link que você seguiu pode ter sido removido ou digitado incorretamente.
      Mas nossa coleção continua aqui, esperando por você.
    </p>

    <div class="botoes">
      <a href="/catalogo.html" class="btn btn--primario">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        Ver Coleção
      </a>
      <a href="/" class="btn btn--secundario">
        Voltar ao Início
      </a>
    </div>

    <div class="divider" aria-hidden="true"></div>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Virtù · <a href="/politicas.html" style="color:inherit;text-decoration:none">Políticas</a> · <a href="/contato.html" style="color:inherit;text-decoration:none">Contato</a></p>
  </footer>

  <script>
    // Redireciona automaticamente para o catálogo após 15 segundos
    // apenas se o utilizador não interagiu com os botões
    var _redirectTimer = setTimeout(function () {
      window.location.replace('/catalogo.html');
    }, 15000);

    document.querySelectorAll('.btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        clearTimeout(_redirectTimer);
      });
    });
  </script>

</body>
</html>
